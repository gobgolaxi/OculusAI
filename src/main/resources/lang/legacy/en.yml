# Every value a key of lang/en.yml has shipped with in an earlier release.
# Generated from git history - do not edit by hand. A server's language
# file whose line still equals one of these was never touched by its owner,
# so Language replaces it with the current bundled text on start-up.
alert:
  hover:
  - <gray>Click to start watching <white>%player%
bypass:
  disabled:
  - <green>Anticheat enabled for <white>%player%<green>.
  enabled:
  - <green>Anticheat disabled for <white>%player%<green>.
  permission:
  - <yellow><bold>%player%<yellow> still has oculusai.bypass - remove it to enable analysis.
  - <yellow>%player% still has oculusai.bypass - remove it to enable analysis.
  save-failed:
  - '<red>Could not save bypass.yml: the list will reset after a restart.'
  unknown:
  - <red>That player has never joined this server.
  usage:
  - '<red>Usage: <white>%value%'
check-settings:
  aim:
    alert-at:
      hint:
      - <gray>Buffer at which Aim starts alerting.
      name:
      - <gold>Alert threshold
    buffer-max:
      hint:
      - <gray>Upper bound for buffer growth.
      name:
      - <aqua>Buffer maximum
    decay:
      hint:
      - <gray>How fast the buffer falls below the threshold.
      name:
      - <aqua>Decay rate
    gain:
      hint:
      - <gray>How fast the buffer rises above the threshold.
      name:
      - <aqua>Growth rate
    leak:
      hint:
      - <gray>Share of the buffer lost on a reading below the threshold. Stops a short cheat burst from staying in the buffer after it ends.
      name:
      - <aqua>Buffer leak
    max-step:
      hint:
      - <gray>The most one reading may add. Makes a cheat prove itself over several windows instead of one spike, which is what alerted honest players. 0 for no cap.
      name:
      - <aqua>Step cap
    punish-at:
      hint:
      - <gray>Buffer at which punishment runs.
      name:
      - <red>Punish threshold
    reset-after-combat:
      hint:
      - <gray>Clear the buffer when no new readings arrive for longer than the combat window.
      name:
      - <aqua>Reset out of combat
    smooth:
      hint:
      - <gray>How many recent windows to average. 1 disables smoothing.
      name:
      - <aqua>Smoothness
  back:
  - <yellow>Back to checks
  back-hint:
  - <dark_gray>Return to the check list.
  disabled:
  - <red>disabled
  enabled:
  - <green>enabled
  header-hint:
  - <dark_gray>Values are saved to config.yml.
  hitbox:
    hitbox-margin:
      hint:
      - <gray>Extra margin around the real target hitbox, in blocks.
      name:
      - <aqua>Hitbox tolerance
    max-angle:
      hint:
      - <gray>Allowed angle between the look and the target hitbox. Covers the attack packet arriving before the look packet.
      name:
      - <aqua>Look tolerance
    max-distance:
      hint:
      - <gray>HitBox does not check farther than this.
      name:
      - <aqua>Maximum distance
  no-description:
  - <dark_gray>No description.
  number-hint:
  - <yellow>Left click <gray>+ <yellow>right click <gray>- <dark_gray>(Shift = x5)
  shared:
    confirmations:
      hint:
      - <gray>Failures in a row needed before an alert.
      name:
      - <aqua>Confirmations
    cooldown-ms:
      hint:
      - <gray>Quiet time between alerts for this check.
      name:
      - <aqua>Cooldown
    enabled:
      hint:
      - <gray>Run this check.
      name:
      - <aqua>Enabled
    test-only:
      hint:
      - <gray>Show alerts but do not punish.
      name:
      - <yellow>Test only
  state-off:
  - '<gray>State: <red>disabled'
  state-on:
  - '<gray>State: <green>enabled'
  toggle-hint:
  - <yellow>Left click <gray>- toggle
  value:
  - '<gray>Current: <white>%value%'
  wall:
    max-distance:
      hint:
      - <gray>Wall does not check farther than this.
      name:
      - <aqua>Maximum distance
check:
  alert-line:
  - <accent><bold>%symbol%</accent> <white><bold>%player% <dark_gray>| <accent><bold>%check% <dark_gray>· <gray>%detail% <dark_gray>· %metrics%
  - <accent>%symbol%</accent> <white>%player% <dark_gray>| <accent>%check% <dark_gray>· <gray>%detail% <dark_gray>· %metrics%
  - <accent>%symbol%</accent> <white>%player% <dark_gray>| <accent>%check% <dark_gray>· <gray>%detail%
  desc:
    hitbox:
    - <gray>Hits a target whose hitbox is larger than allowed.
  name:
    aim:
    - Neuro Aim
    - Aim
  reason:
    aim:
    - prob %probability%, buffer %buffer%
    - prob %probability%
    hitbox:
    - target hitbox %width%x%height% exceeds %max-width%x%max-height%
  test-line:
  - <dark_gray>[TEST] <accent><bold>%symbol%</accent> <white><bold>%player% <dark_gray>| <accent><bold>%check% <dark_gray>· <gray>%detail% <dark_gray>· %metrics%
  - <dark_gray>[TEST] <accent>%symbol%</accent> <white>%player% <dark_gray>| <accent>%check% <dark_gray>· <gray>%detail% <dark_gray>· %metrics%
  - <dark_gray>[TEST] <accent>%symbol%</accent> <white>%player% <dark_gray>| <accent>%check% <dark_gray>· <gray>%detail%
