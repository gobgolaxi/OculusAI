prefix: "<gradient:%primary%:%secondary%><bold>ʏᴜᴘᴘʏᴀɪ</bold></gradient> <dark_gray>» <gray>"
language: "ru"

theme:
  name: "aurora"

api:
  url: ""
  timeout-ms: 1500
  key: ""
  dataset-key: ""

analysis:
  window-ticks: 20
  # Сколько мобов отслеживать на тик, чтобы считать ошибку прицела по ним.
  # 0 — только игроки, и тогда бой по манекену даёт aim_error == 0.
  track-entities: 600
  min-attacks: 1
  combat-ticks: 40
  min-rotation: 5.0
  min-attack-rotation: 2.5

buffer:
  suspicion: 0.5
  gain: 1.5
  decay: 1.4
  max: 10.0
  alert-at: 1.7
  punish-at: 5.0
  alert-cooldown-ms: 10000

display:
  alert-symbol: "⚠"
  alert-format: "<%primary%>%player%</%primary%> <gray>aim <white>%probability% <dark_gray>| <gray>buffer <white>%buffer%<dark_gray>/<white>%max%"
  alert-click: "<yellow>[Следить]"
  alert-click-command: "prob"

punishment:
  enabled: true
  # Выполняется от имени консоли. Пусто — обычный kick с причиной ниже.
  command: ""
  broadcast: "<red>%player% <gray>removed after <white>%buffer%<gray> buffer"
  evidence:
    enabled: false
    seconds: 180
    label: "cheater"
    min-probability: 0.7
    min-buffer: 3.0
    cancel-below: 4.0

recording:
  progress-seconds: 15

# История показаний хранится на диске, поэтому её видно и после кика игрока.
# keep - сколько последних показаний держать на игрока (одно примерно раз в
# полсекунды боя), flush-seconds - как часто сбрасывать на диск.
history:
  keep: 2000
  flush-seconds: 30

test-server:
  enabled: false
  world: "yuppyai_test"
  scoreboard-refresh-ticks: 100
  model-refresh-seconds: 30
