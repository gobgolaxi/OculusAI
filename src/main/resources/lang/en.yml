  refresh: "<white>Refresh"
  no-permission: "<red>No permission"
  click-toggle: "<yellow>Click to toggle"
  click-train: "<yellow>Click to train"
  player-offline: "<red>That player is not online."
command:
  no-permission: "<red>You lack permission."
  players-only: "<red>Players only."
  unknown: "<red>Unknown subcommand. Try <white>/%label% help<red>."
help:
  divider: "<dark_gray><st>                                        "
  header: "<gray>version <white>%version% <dark_gray>- <gray>service <white>%status%"
  status:
    up: "<green>up"
    down: "<red>down"
  command:
    help: "Show this list."
    journal: "Open the live suspicion journal."
    prob: "Watch a player's live aim reading."
    player: "View a player's suspicion data."
    vanish: "Enter or leave hidden spectator observation."
    forget: "Drop the current suspicion and start over."
    data: "Record and label training data."
    dashboard: "Open the dataset and model dashboard."
    reload: "Re-read config.yml."
    npc: "Spawn a sparring dummy that attacks you."
theme:
  aurora: "Aurora"
  ember: "Ember"
  ocean: "Ocean"
  rose: "Rose"
  mint: "Mint"
  midnight: "Midnight"
dashboard:
  title: "Dashboard"
  service:
    up: "<green>Service up"
    down: "<red>Service down"
    answering: "<gray>Answering normally."
    start: "<red>Start it from the api folder:"
    start-command: "<white>uvicorn main:app --port 8000"
  shared:
    stored: "<gray>Stored: <white>%value%"
  cheater:
    name: "<red>Cheater windows"
    line1: "<gray>Recorded with <white>/yai data train"
    line2: "<gray>then committed with <white>add cheater"
  legit:
    name: "<green>Legit windows"
  model:
    name: "<aqua>Model"
    none: "<red>Nothing trained yet."
    collect: "<gray>Collect both labels, then press Train."
    accuracy: "<gray>Accuracy: <white>%value%"
    measured: "<gray>Measured: <white>%value%"
    kind: "<gray>Model: <white>%value%%suffix%"
    uncalibrated: " <red>(uncalibrated)"
    brier: "<gray>Brier: <white>%value% <dark_gray>(0.25 = coin flip)"
    samples: "<gray>Trained on: <white>%value%<gray> windows"
    fitted: "<gray>Fitted: <white>%value%"
    holdout1: "<dark_gray>Measured on players held out of training"
    holdout2: "<dark_gray>entirely, not on windows held back."
  theme:
    name: "<aqua>Theme"
    current: "<gray>Current: <white>%value%"
    click: "<yellow>Click to switch theme"
    changed: "<gray>Theme changed to <white>%value%<gray>."
  train:
    name: "<gold>Train"
    line1: "<gray>Fits a fresh model on everything stored"
    line2: "<gray>and reports how well it scored."
    need-data: "<red>Both labels need data first."
    ready: "<gray>Ready: <white>%value%<gray> windows"
    hint: "<dark_gray>Uses Bukkit permissions and the configured API key."
    running: "<gray>Training..."
    failed: "<red>Training failed. Check the API key/service log."
    done: "<green>Trained. <gray>Accuracy <white>%accuracy% <gray>on <white>%samples%<gray> windows."
  datasets:
    name: "<aqua>Datasets"
    counts: "<gray>Sessions: <white>%sessions% <dark_gray>(<green>%enabled%<dark_gray> counted)"
    line1: "<gray>Each recording is its own file, so one"
    line2: "<gray>can be left out of training and put back."
    click: "<yellow>Click to browse them"
  players:
    name: "<aqua>Players"
    online: "<gray>Online: <white>%value%"
    click: "<yellow>Click to see live readings"
  automod:
    name: "<gold>Chat AutoMod"
    state-on: "<gray>State: <green>on"
    state-off: "<gray>State: <red>off"
    line1: "<gray>Checks chat messages before they reach"
    line2: "<gray>global chat and blocks risky ones."
  punish:
    name: "<red>Act on detections"
    state-on: "<gray>State: <red>on"
    state-off: "<gray>State: <green>off - alerts only"
    command: "<gray>Command: <white>%value%"
    line1: "<gray>Leave this off until you have watched"
    line2: "<gray>the model be right on your own server."
  evidence:
    name: "<gold>Evidence window"
    state-on: "<gray>State: <gold>%value%s before acting"
    state-off: "<gray>State: <dark_gray>off - acts immediately"
    line1: "<gray>A detection keeps recording for that long,"
    line2: "<gray>files it as <white>%value%<gray>, and only then acts."
    line3: "<gray>A buffer that drains below <white>%value%<gray> calls it off."
  alertsound:
    name: "<light_purple>Alert Sound"
    current: "<gray>Current: <white>%value%"
    params: "<gray>Volume <white>%volume%<gray>, pitch <white>%pitch%"
    line1: "<gray>Changes the sound heard by"
    line2: "<gray>players with alert permission."
  kickanim:
    name: "<red>Kick Animation"
    current: "<gray>Current: <white>%value%"
    line1: "<gray>Visual effect played when a"
    line2: "<gray>cheater gets kicked from the server."
  alwaysprob:
    name: "<aqua>AlwaysProb"
    state-on: "<gray>State: <green>on"
    state-off: "<gray>State: <red>off"
    line1: "<gray>Shows compact Prob holograms"
    line2: "<gray>for every visible player."
  refresh:
    lore: "<gray>Ask the service again."
  balance:
    need-both: "<gray>Both labels are needed to train."
    lopsided: "<red>Lopsided %value%:1 - collect more of the smaller side"
    healthy: "<gray>Balance <white>%value%:1<gray>, healthy"
