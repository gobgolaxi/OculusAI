# Every value a key of lang/ru.yml has shipped with in an earlier release.
# Generated from git history - do not edit by hand. A server's language
# file whose line still equals one of these was never touched by its owner,
# so Language replaces it with the current bundled text on start-up.
alert:
  hover:
  - <gray>Нажми, чтобы следить за <white>%player%
bypass:
  disabled:
  - <green>Античит снова включён для <white>%player%<green>.
  enabled:
  - <green>Античит выключен для <white>%player%<green>.
  permission:
  - <yellow>У <bold>%player%<yellow> всё ещё есть право oculusai.bypass - сними его, чтобы включить анализ.
  - <yellow>У %player% всё ещё есть право oculusai.bypass - сними его, чтобы включить анализ.
  save-failed:
  - '<red>Не удалось сохранить bypass.yml: после перезапуска список сбросится.'
  unknown:
  - <red>Такой игрок ещё ни разу не заходил на сервер.
  usage:
  - '<red>Использование: <white>%value%'
check-settings:
