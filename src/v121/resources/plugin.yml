name: YuppyAI
version: '${version}'

main: me.everyone.yuppyai.YuppyAI
api-version: '1.21'
load: POSTWORLD
author: everyone
description: Aim analysis for Paper, backed by a neural network served over HTTP.

depend: [ProtocolLib]
softdepend: [WorldGuard, WorldEdit]

commands:
  yuppyai:
    description: Main YuppyAI command.
    usage: /yai help
    aliases: [yai, ai]

permissions:
  yuppyai.command:
    description: Access to /yai.
    default: false
  yuppyai.alerts:
    description: Receive detection alerts.
    default: false
  yuppyai.journal:
    description: Open the live suspicion journal.
    default: false
  yuppyai.vanish:
    description: Enter and leave hidden spectator observation.
    default: false
  yuppyai.data:
    description: Record and label training data.
    default: false
  yuppyai.bypass:
    description: Never analysed.
    default: false
  yuppyai.npc:
    description: Spawn a sparring dummy that attacks you.
    default: false
  yuppyai.connect:
    description: Bind this server to a YuppyAI account.
    default: op
  yuppyai.report:
    description: Report a player to the panel.
    default: true
  yuppyai.diag:
    description: Inspect why a player's windows are or are not analysed.
    default: op
