      hint:
      - <gray>Пауза между алертами одной проверки.
      name:
      - <aqua>Кулдаун
    enabled:
      hint:
      - <gray>Выполнять эту проверку.
      name:
      - <aqua>Включена
    test-only:
      hint:
      - <gray>Показывать алерты, но не наказывать.
      name:
      - <yellow>Только тест
