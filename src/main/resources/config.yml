prefix: "<gradient:%primary%:%secondary%><bold>ᴏᴄᴜʟᴜsᴀɪ</bold></gradient> <dark_gray>» <gray>"
language: "ru"

theme:
  name: "aurora"

api:
  # Адрес сервиса. Пусто означает публичный сервис - тот же, что в api.site;
  # свой адрес нужен только для локального инстанса.
  url: "https://oculusai.space"
  timeout-ms: 1500
  key: ""
  dataset-key: ""
  # Куда отправлять за ключом, если он не указан.
  site: "https://oculusai.space"

# Проверка обновлений через сервис. Новая сборка скачивается в папку обновлений
# сервера и применяется при следующем запуске - заменять jar под работающим
# плагином значит получить классы наполовину из одной версии, наполовину из
# другой, поэтому перезапуск остаётся за тобой.
#
# Скачивание разрешено только по https и только с github.com, и сервис обязан
# назвать sha256 - то, что пришло, проверяется байт в байт, иначе файл
# выбрасывается. Список хостов в конфиг не выносится намеренно: настройка,
# позволяющая указать произвольный источник jar, превращает доступ к конфигу в
# запуск чужого кода.
update:
  enabled: true
  # false - только сообщать о новой версии со ссылкой, ничего не скачивая.
  download: true
  check-hours: 6
  # Как часто напоминать в чат тем, у кого есть oculusai.alerts, пока сервер
  # сидит на старой версии. Сервис спрашивается раз в check-hours, а строка
  # повторяется по этому таймеру - чтобы зашедший позже админ её тоже увидел.
  # 0 - сказать один раз за проверку и больше не повторять.
  remind-seconds: 15

analysis:
  # Главный выключатель анализа. Когда false, модель и проверки не запускаются,
  # но история, журнал и команды продолжают работать.
  enabled: true
  window-ticks: 20
  # Анализируется только бой по игрокам и манекенам. Удар по мобу или любой
  # другой сущности не считается боем вообще: моб идёт по прямой с постоянной
  # скоростью и не стрейфит, поэтому обычная ферма мобов даёт ту же ровную
  # точную ротацию, которую модель обучена читать как чит.
  min-attacks: 1
  combat-ticks: 40
  min-rotation: 5.0
  min-attack-rotation: 2.5
  # Насколько далеко назад смотрит бегущая статистика по прицелу (колонки
  # *_run_mean и *_run_std) - примерно столько последних окон ещё имеют вес.
  # Раньше она копила с момента входа и ничего не забывала, и игрок этим
  # пользовался: каждая честная минута прибавляла веса среднему, так что
  # включённый позже чит в нём растворялся. Одна и та же читерская запись со
  # свежего входа даёт p=0.909 и кик за 5 секунд, а после трёх минут честного
  # боя того же игрока - p=0.433 и кика не будет вовсе. При горизонте 15
  # та же запись снова даёт 0.854 и кик за 7 секунд. 0 - вернуть старое
  # поведение без забывания.
  running-horizon: 15

buffer:
  # Сколько последних показаний брать медианой перед тем, как кормить буфер.
  # Окно это полсекунды боя и может содержать один удар, а при одном ударе
  # часть колонок вырождается - aim_error_std тождественно нуль - поэтому
  # отдельное показание дрожит сильнее, чем поведение игрока. Медиана по трём
  # окнам режет дрожание примерно вдвое и не стоит ничего: на всех записанных
  # читерских сессиях кик по-прежнему наступает во всех 47 и с той же медианой
  # в 5 секунд. 1 - без сглаживания.
  smooth-windows: 3
  suspicion: 0.5
  gain: 1.5
  decay: 1.4
  # Какую долю буфера теряет показание ниже порога подозрительности. Без
  # этого буфер, набранный за пару секунд читом, почти не спадал, пока
  # следующее окно было чуть ниже порога: расстояние до порога мало, значит
  # и вычиталось мало, и честный удар через секунду после чита уходил в алерт
  # с низкой вероятностью в строке. 0 - старое поведение без утечки.
  leak: 0.4
  max: 10.0
  alert-at: 1.7
  punish-at: 5.0
  alert-cooldown-ms: 10000

display:
  alert-symbol: "⚠"

punishment:
  enabled: true
  # Выполняется от имени консоли. Пусто — наказание делает сам плагин: см.
  # strip ниже.
  command: ""
  # Что делает пустой command. false — обычный kick. true — высыпать весь
  # инвентарь на землю, убить и выкинуть с сервера. Вещи выбрасываются
  # явно, до смерти: иначе keepInventory вернул бы их на респавне, и
  # наказание зависело бы от геймрула. Необратимо для игрока — включайте,
  # только если доверяете порогу наказания. При заданном command не
  # действует: тогда наказание целиком в нём.
  strip: false
  broadcast: "<red>%player% <gray>removed after <white>%buffer%<gray> buffer"
  # Не даёт одному и тому же игроку получать наказание на каждом алерте.
  cooldown-ms: 60000
  # Сколько наказаний игрок может набрать, прежде чем следующее станет
  # баном. 0 — не банить никогда. Текущее наказание тоже считается, так
  # что 3 банит на третьем. Счёт берётся из истории игрока, поэтому
  # переживает перезапуск — и живёт не дольше history.retention-days.
  ban-after: 0
  # Чем банить. Пусто — ванильный /ban от имени консоли, он же кикает;
  # при strip: true игрока перед этим так же разденут и убьют. Задана —
  # выполняется только она, strip не применяется.
  # Плейсхолдеры: %player%, %probability%, %buffer%, %punishments%.
  ban-command: ""
  # Что показать на месте наказанного, когда плагин наказывает сам, то есть
  # при пустом command (или ban-command для бана). Заданная команда свои
  # эффекты показывает сама, и сюда плагин не вмешивается.
  # none | ascend | explode | lightning | firework | wither | random
  # Мир не страдает: взрыв - это партиклы и звук, а не createExplosion,
  # молния бьёт эффектом, без огня и урона.
  # Меняется на лету: /oai animations <вариант> - он же покажет эффект на
  # вас, - или кнопкой в /oai dashboard.
  # Пока шоу идёт, игрок подброшен и заморожен: его удары, повороты и
  # перемещения не доходят до сервера. Кик - только после конца.
  animation: ascend
  # Игрок, которого сейчас пишут в датасет (/oai data train), наказание не
  # получает: его для того на ростер и ставили, а кик обрывает запись ровно
  # на тех окнах, ради которых она велась. Анализ, показания и алерты при
  # этом работают как обычно. false - наказывать и во время записи.
  skip-while-recording: true

recording:
  progress-seconds: 15

# Слежение за всеми: /oai monitor без имён включает его, повтор - выключает.
# Строки получает только тот, кто включил: в чат раз в секунду падают те, кто
# сейчас дерётся с игроком, их вероятность и буфер. pvp-seconds - сколько
# секунд после последнего удара по игроку человек ещё считается "в пвп".
monitor:
  # Что делать при первом запуске, пока нет файла monitor.state: false -
  # ничего не показывать, true - слать строки в консоль. Дальше команда сама
  # запоминает, кому их присылать, и переживает перезапуск.
  enabled: false
  pvp-seconds: 5

# История показаний хранится на диске, поэтому её видно и после кика игрока.
# keep - сколько последних показаний держать на игрока (одно примерно раз в
# полсекунды боя), flush-seconds - как часто сбрасывать на диск.
history:
  keep: 2000
  flush-seconds: 30
  # Сколько игроков держать в памяти одновременно. Старые чистые записи
  # выгружаются из памяти и при необходимости читаются с диска снова.
  max-players: 5000
  # Через сколько дней удалять файлы истории. 0 - хранить вечно.
  retention-days: 30

test-server:
  enabled: false
  world: "oculusai_test"
  scoreboard-refresh-ticks: 100
  model-refresh-seconds: 30

checks:
  enabled: true
  test-mode: true
  alert-cooldown-ms: 5000
  confirmations: 2
  wall:
    enabled: true
    max-distance: 6.0
    cooldown-ms: 5000
    test-only: false
  hitbox:
    enabled: true
    max-distance: 6.0
    # Допуск вокруг реального хитбокса цели: компенсирует движение между пакетами.
    hitbox-margin: 0.1
    # Пакет атаки не содержит поворота, поэтому честный флик может прийти
    # на один пакет раньше взгляда. Этот угол убирает ложные срабатывания;
    # удар, направленный явно в сторону от цели, всё равно отменяется.
    max-angle: 25.0
    # true - писать в лог угол, дистанцию и пинг для каждого промаха HitBox.
    # Включайте только для диагностики: строк будет много.
    debug: false
    cooldown-ms: 5000
    test-only: false
  aim:
    enabled: true
    # Smoothness: сколько последних окон усреднять перед подачей в буфер.
    # 1 - без сглаживания. Старый ключ buffer.smooth-windows читается как
    # запасной вариант, если этого ключа ещё нет.
    smooth-windows: 3
    # Сбрасывать буфер, когда игрок затих: и новых окон нет, и он не бьёт
    # дольше reset-after-ms. Тогда старые показания больше не описывают то,
    # что он делает сейчас, и следующая драка начинается с нуля, а не с пика
    # прошлой.
    reset-after-combat: true
    # Сколько тишины для этого нужно. Считаются оба условия сразу: окна не
    # приходят И ударов нет. Раньше сброс смотрел только на окна и брал срок
    # из analysis.combat-ticks, то есть 2 секунды, - а окно отбрасывается при
    # повороте ниже порога или при нехватке ударов, что в живом бою бывает
    # постоянно. Из-за этого буфер обнулялся прямо посреди PvP. Не может быть
    # меньше analysis.combat-ticks.
    reset-after-ms: 8000
    confirmations: 1
    cooldown-ms: 10000
    test-only: false
