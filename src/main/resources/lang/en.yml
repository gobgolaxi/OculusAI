check-settings:
  title: "Settings: %check%"
  state-on: "<gray>State: <green>enabled"
  state-off: "<gray>State: <red>disabled"
  no-description: "<dark_gray>No description."
  header-hint: "<dark_gray>Values are saved to config.yml."
  value: "<gray>Current: <white>%value%"
  enabled: "<green>enabled"
  disabled: "<red>disabled"
  seconds: "s"
  toggle-hint: "<yellow>Left click <gray>- toggle"
  number-hint: "<yellow>Left click <gray>+ <yellow>right click <gray>- <dark_gray>(Shift = x5)"
  back: "<yellow>Back to checks"
  back-hint: "<dark_gray>Return to the check list."
  shared:
    enabled:
      name: "<aqua>Enabled"
      hint: "<gray>Run this check."
    test-only:
      name: "<yellow>Test only"
      hint: "<gray>Show alerts but do not punish."
    confirmations:
      name: "<aqua>Confirmations"
      hint: "<gray>Failures in a row needed before an alert."
    cooldown-ms:
      name: "<aqua>Cooldown"
      hint: "<gray>Quiet time between alerts for this check."
  aim:
    smooth:
      name: "<aqua>Smoothness"
      hint: "<gray>How many recent windows to average. 1 disables smoothing."
    alert-at:
      name: "<gold>Alert threshold"
      hint: "<gray>Buffer at which Aim starts alerting."
    punish-at:
      name: "<red>Punish threshold"
      hint: "<gray>Buffer at which punishment runs."
    buffer-max:
      name: "<aqua>Buffer maximum"
      hint: "<gray>Upper bound for buffer growth."
    gain:
      name: "<aqua>Growth rate"
      hint: "<gray>How fast the buffer rises above the threshold."
    decay:
      name: "<aqua>Decay rate"
      hint: "<gray>How fast the buffer falls below the threshold."
    leak:
      name: "<aqua>Buffer leak"
      hint: "<gray>Share of the buffer lost on a reading below the threshold. Stops a short cheat burst from staying in the buffer after it ends."
    max-step:
      name: "<aqua>Step cap"
      hint: "<gray>The most one reading may add. Makes a cheat prove itself over several windows instead of one spike, which is what alerted honest players. 0 for no cap."
    reset-after-combat:
      name: "<aqua>Reset out of combat"
      hint: "<gray>Clear the buffer when no new readings arrive for longer than the combat window."
  wall:
    max-distance:
      name: "<aqua>Maximum distance"
      hint: "<gray>Wall does not check farther than this."
  hitbox:
    max-distance:
      name: "<aqua>Maximum distance"
      hint: "<gray>HitBox does not check farther than this."
    hitbox-margin:
      name: "<aqua>Hitbox tolerance"
      hint: "<gray>Extra margin around the real target hitbox, in blocks."
    max-angle:
      name: "<aqua>Look tolerance"
      hint: "<gray>Allowed angle between the look and the target hitbox. Covers the attack packet arriving before the look packet."
