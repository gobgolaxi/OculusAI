      hint:
      - <gray>Насколько быстро буфер падает ниже порога.
      name:
      - <aqua>Скорость спада
    gain:
      hint:
      - <gray>Насколько быстро буфер растёт выше порога.
      name:
      - <aqua>Скорость роста
    leak:
      hint:
      - <gray>Доля буфера, которая теряется на показании ниже порога. Не даёт короткому читу висеть в буфере после того, как он закончился.
      name:
      - <aqua>Утечка буфера
    max-step:
      hint:
      - <gray>Сколько максимум может прибавить одно показание. Требует от чита серии высоких окон вместо одного всплеска, из-за которого честный игрок ловил алерт. 0 - без потолка.
      name:
      - <aqua>Потолок шага
    punish-at:
      hint:
      - <gray>Буфер, после которого срабатывает наказание.
      name:
      - <red>Порог наказания
    reset-after-combat:
      hint:
      - <gray>Обнулять буфер, когда новые показания не приходят дольше времени боя.
      name:
      - <aqua>Сброс вне боя
    smooth:
      hint:
      - <gray>Сколько последних окон усреднять. 1 - без сглаживания.
      name:
      - <aqua>Smoothness
  back:
  - <yellow>Назад к проверкам
  back-hint:
  - <dark_gray>Вернуться к списку проверок.
  disabled:
  - <red>выключено
  enabled:
  - <green>включено
  header-hint:
  - <dark_gray>Значения сохраняются в config.yml.
  hitbox:
