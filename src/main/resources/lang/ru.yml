    lore: "<gray>Снова запросить сервис."
  balance:
    need-both: "<gray>Для обучения нужны оба лейбла."
    lopsided: "<red>Перекос %value%:1 - собери больше меньшей стороны"
    healthy: "<gray>Баланс <white>%value%:1<gray>, нормальный"
