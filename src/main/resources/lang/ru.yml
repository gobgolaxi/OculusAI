    name: "<light_purple>Звук алерта"
    current: "<gray>Текущий: <white>%value%"
    params: "<gray>Громкость <white>%volume%<gray>, тон <white>%pitch%"
    line1: "<gray>Меняет звук, который слышат"
    line2: "<gray>пользователи с правом на алерты."
  kickanim:
    name: "<red>Анимация кика"
    current: "<gray>Текущая: <white>%value%"
    line1: "<gray>Визуальный эффект при кике"
    line2: "<gray>читера с сервера."
  alwaysprob:
    name: "<aqua>AlwaysProb"
    state-on: "<gray>Состояние: <green>вкл"
    state-off: "<gray>Состояние: <red>выкл"
