# Как выглядят живые показания: голограмма над головой и строка над хотбаром.
#
# Общий принцип этих форматов - показывать только то, чего на экране ещё нет.
# Ник игрока парит над ним и так, подписи вроде "aim" и "buffer" повторяются в
# каждом кадре и ничего не добавляют, поэтому остались два числа: показание
# текущего окна и полоса буфера - насколько близко до наказания.
#
# Плейсхолдеры: %probability% %buffer% %max_buffer% %bar% %player% %trend%
#               %windows% %state% %heat% %buffer_heat%
#               %primary% %secondary% %accent% %accent_soft%
# %heat% - цвет по величине показания, %buffer_heat% - по заполненности буфера.

# Над хотбаром. Здесь ник нужен: смотреть можно и не на того, за кем следишь.
actionbar: "<gray>%player% <%heat%>%probability% %bar%"

hologram:
  # Голограмма над головой в одну строку. Шесть строк в бою закрывают собой
  # того, за кем следишь.
  # false вернёт многострочный format ниже.
  compact: true
  compact-format: "<%heat%>%probability% %bar%"

  # Что показывать, когда окна не идут. Число, оставшееся с прошлой минуты,
  # выглядит точно так же, как живое, и именно это сильнее всего вводит в
  # заблуждение того, кто смотрит. Причины все попадают сюда и все достойны
  # показа: игрок вне боя, не бьёт, ротация ниже гейта, его мир исключён, у
  # него право bypass, или сервис не отвечает.
  # Окно приходит примерно раз в полсекунды боя, поэтому пара секунд тишины -
  # это уже остановка, а не пауза. Работают и <red>, и &c.
  stale-seconds: 3
  stale-format: "<dark_gray>—"

  # Используется только при compact: false. Те же два числа плюс ход
  # последних окон и счётчик - для разбора, а не для боя.
  format:
    - "<%heat%>%probability% %bar%"
    - "<dark_gray>%trend%  <gray>%windows%"
  lines: 2
  seconds: 300
  offset: 1.1
