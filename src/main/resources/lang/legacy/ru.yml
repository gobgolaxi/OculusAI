      hint:
      - <gray>Дополнительный запас вокруг реального хитбокса цели в блоках.
      name:
      - <aqua>Допуск хитбокса
    max-angle:
      hint:
      - <gray>Допустимый угол между взглядом и хитбоксом цели. Компенсирует пакет атаки, пришедший раньше пакета поворота.
      name:
      - <aqua>Допуск взгляда
    max-distance:
      hint:
      - <gray>Дальше этой дистанции HitBox не проверяет.
      name:
      - <aqua>Максимальная дистанция
  no-description:
  - <dark_gray>Описание не задано.
  number-hint:
  - <yellow>ЛКМ <gray>+ <yellow>ПКМ <gray>- <dark_gray>(Shift = x5)
  shared:
    confirmations:
      hint:
      - <gray>Сколько срабатываний подряд нужно до алерта.
      name:
      - <aqua>Подтверждения
