# Строка над хотбаром. Треугольник - куда идёт буфер: вверх к наказанию,
# вниз - утекает. Ник здесь нужен: смотреть можно и не на того, за кем
# следишь. Плейсхолдер %arrow% доступен и в остальных форматах.
# %groups% - насколько каждая группа признаков редкая для честных игроков,
# от 0 до 1, среднее за последние 4 окна: 0 - так бывает хотя бы у каждого
# десятого честного окна, 1 - реже одного из тысячи. R - Rotation, A - Aim,
# H - Hits, C - Crits, S - SprintReset. Цвет - по тому же значению.
actionbar: "%arrow% <white>%player% <dark_gray>| <white>%probability% <dark_gray>| <white>%buffer%<dark_gray>/<white>%max_buffer% <dark_gray>| %groups%"

hologram:
  # Голограмма над головой в одну строку. Шесть строк в бою закрывают собой
  # того, за кем следишь, а два числа, которые что-то решают, — показание и
  # буфер — помещаются в одну строку с запасом.
  # false вернёт многострочный format ниже.
  compact: true
  # Ник не пишется: игрок, над которым висит голограмма, подписан своей же
  # табличкой прямо под ней. %avg% - средняя за последние 5 окон, %recent% -
  # сами эти окна, каждое с маркером в цвете детекта. Числа - как их выдала
  # модель. Доступны и прежние %probability% и %bar%.
  compact-format: "<white>AVG: %avg% <dark_gray>| %recent%"

  # Что показывать, когда окна не идут. Число, оставшееся с прошлой минуты,
  # выглядит точно так же, как живое, и именно это сильнее всего вводит в
  # заблуждение того, кто смотрит. Причины все попадают сюда и все достойны
  # показа: игрок вне боя, не бьёт, ротация ниже гейта, его мир исключён, у
  # него право bypass, или сервис не отвечает.
  # Окно приходит примерно раз в полсекунды боя, поэтому пара секунд тишины -
  # это уже остановка, а не пауза. Работают и <red>, и &c.
  stale-seconds: 3
  stale-format: "&cno analysing"

  # Используется только при compact: false.
  format:
    - "<gray>⚡ <white>%probability% <dark_gray>| <gray>❤ buffer <white>%buffer%<dark_gray>/<white>%max_buffer%"
    - "<gray>♫ %bar%"
    - "<dark_gray>♬ trend <gray>%trend%"
    - "<dark_gray>☹ %state%"
    - "<dark_gray>♠ windows <white>%windows%"
  lines: 5
  seconds: 300
  # Высота голограммы. Меняется и из Dashboard: ЛКМ/ПКМ по предмету
  # "Высота Prob-голограммы". Итог не ниже 2.25 блока над ногами.
  offset: 1.1
