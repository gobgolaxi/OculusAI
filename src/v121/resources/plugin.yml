name: OculusAI
version: '${version}'

main: me.everyone.oculusai.OculusAI
api-version: '1.21'
# Folia runs the analysis, alerts and punishments; holograms, the sparring
# manikin and the test arena switch themselves off there. Without this flag
# Folia refuses to load the plugin at all, which is worse than loading it
# with the three display features missing.
folia-supported: true
load: POSTWORLD
author: everyone
description: Aim analysis for Paper, backed by a neural network served over HTTP.

depend: [ProtocolLib]
softdepend: [WorldGuard, WorldEdit]

commands:
  oculusai:
    description: Main OculusAI command.
    usage: /oai help
    aliases: [oai, ai]

permissions:
  oculusai.command:
    description: Access to /oai.
    default: false
  oculusai.alerts:
    description: Receive detection and check alerts.
    default: false
  oculusai.journal:
    description: Open the live suspicion journal.
    default: false
  oculusai.data:
    description: Record and label training data.
    default: false
  oculusai.punish:
    description: Kick and ban by hand through the anticheat's send-off.
    default: op
  oculusai.bypass:
    description: Never analysed.
    default: false
  oculusai.npc:
    description: Spawn a sparring dummy that attacks you.
    default: false
  oculusai.connect:
    description: Bind this server to a OculusAI account.
    default: op
  oculusai.report:
    description: Report a player to the panel.
    default: true
  oculusai.alwaysprob:
    description: See every player's reading over their head, permanently.
    default: op
  oculusai.reputation:
    description: Look up the addresses and cross-server reputation of a name.
    default: op
  oculusai.diag:
    description: Inspect why a player's windows are or are not analysed.
    default: op
