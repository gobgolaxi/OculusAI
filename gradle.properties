group=me.everyone

# Версия плагина - здесь и больше нигде.
#
# Раньше её печатали в командной строке при каждой сборке, а в build.gradle.kts
# лежало запасное значение, которое устаревало на следующий же день: сборка без
# флага штамповала jar чужим номером. Плагин сравнивает этот номер с тем, что
# отдаёт сервис, поэтому неверный штамп - это не косметика, а сервер, который
# никогда не узнает, что устарел.
#
# Меняется только через ./tools/release.sh - он же собирает, тегает и
# выкладывает, так что номер в jar, в теге и в релизе не могут разойтись.
pluginVersion=1.13.0
mcVersion=1.21.4
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.caching=true
